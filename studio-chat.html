<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; connect-src https://peppy-chimera-c97410.netlify.app; img-src 'self'; base-uri 'none'; form-action 'none'">
<title>Диалог с посетителем | Key Design Studio</title>
<link rel="icon" href="/assets/favicon-32.png"><link rel="stylesheet" href="/home-contact.css?v=4">
<script src="/brief-config.js?v=5" defer></script><script src="/home-chat.js?v=4" defer></script>
</head><body class="chat-office"><main id="question-panel" class="contact-dialog" data-staff aria-labelledby="chat-title"><header class="chat-head"><span class="chat-avatar" aria-hidden="true"></span><div><small lang="en">Key Design Studio</small><h2 id="chat-title" data-chat-copy="title">Диалог с посетителем</h2></div></header>
    <div class="chat-scroll">
      <p class="chat-intro" data-chat-copy="hint"></p>
      <div id="chat-thread" role="log" aria-live="polite" aria-label="Переписка"></div>
      <p id="chat-waiting" data-chat-copy="waiting" hidden></p>
    </div>
    <form id="question-form">
      <p id="chat-status" role="status"></p>
      <div class="chat-compose"><textarea id="contact-question" name="message" rows="2" maxlength="1500" required aria-label="Сообщение" placeholder="Напишите сообщение…"></textarea><button class="chat-send" type="submit" aria-label="Отправить сообщение"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V4m-7 7 7-7 7 7"/></svg></button></div>
      
    </form>
</main></body></html>
